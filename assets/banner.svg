<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(-10px, 15px); opacity: 0.6; }
    }
    @keyframes floatBox {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes shimmerLine {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    
    .animated-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-orb-2 {
      animation: pulseOrb 11s ease-in-out infinite reverse;
      transform-origin: center;
    }
    .floating-icon {
      animation: floatBox 6s ease-in-out infinite;
    }
    .floating-icon-delayed {
      animation: floatBox 7s ease-in-out infinite 2s;
    }
    .tech-line {
      stroke-dasharray: 200;
      animation: shimmerLine 12s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Dynamic Background Elements -->
  <g id="background-animations">
    <!-- Glowing Orbs -->
    <circle class="animated-orb-1" cx="1050" cy="80" r="180" fill="url(#accentGlow)" />
    <circle class="animated-orb-2" cx="150" cy="280" r="220" fill="url(#accentGlow)" />

    <!-- Grid Line Patterns -->
    <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.3">
      <line x1="0" y1="60" x2="1200" y2="60" />
      <line x1="0" y1="140" x2="1200" y2="140" />
      <line x1="0" y1="220" x2="1200" y2="220" />
      <line x1="0" y1="300" x2="1200" y2="300" />
      <line x1="200" y1="0" x2="200" y2="340" />
      <line x1="500" y1="0" x2="500" y2="340" />
      <line x1="800" y1="0" x2="800" y2="340" />
      <line x1="1000" y1="0" x2="1000" y2="340" />
    </g>

    <!-- Animated Tech Connection Lines -->
    <path class="tech-line" d="M 850,50 L 950,110 L 1100,110" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.4" />
    <path class="tech-line" d="M 100,280 L 250,220 L 400,280" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.4" />

    <!-- Floating Repository Package Boxes -->
    <g class="floating-icon" opacity="0.25">
      <rect x="980" y="140" width="64" height="64" rx="12" fill="#38bdf8" />
      <path d="M 1000 160 L 1024 160 M 1012 148 L 1012 172" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    </g>

    <g class="floating-icon-delayed" opacity="0.2">
      <rect x="120" y="70" width="56" height="56" rx="10" fill="#a855f7" />
      <circle cx="148" cy="98" r="14" fill="none" stroke="#0f172a" stroke-width="4" />
    </g>
  </g>

  <!-- Foreground Content (Text & Badges) -->
  <g id="foreground-content" transform="translate(70, 0)">

    <!-- Top Badge Pill -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="130" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">
        📦 DEVOPS &amp; REPOSITORY ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Artifact Repository Manager
    </text>

    <!-- Subtitle -->
    <text x="0" y="178" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400">
      Curated List of SaaS Products, OCI Registries &amp; Open-Source Package Managers
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 220)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="80" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">⚡ Multi-Format Feeds</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(172, 0)">
        <rect width="165" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="82" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">🛡️ Supply Chain Security</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(349, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="80" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">🐳 OCI &amp; Helm Storage</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(521, 0)">
        <rect width="150" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="75" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">🌟 Open Source &amp; SaaS</text>
      </g>
    </g>

    <!-- Footer Meta -->
    <text x="0" y="295" fill="#64748b" font-family="sans-serif" font-size="13">
      Updated continuously • Managed for Platform Engineers &amp; DevOps Teams
    </text>

  </g>
</svg>
